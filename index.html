<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YATRA — Welcome</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: var(--font-body); 
      height: 100vh; 
      overflow: hidden; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      background-color: var(--ink);
    }

    /* ─── Full Screen Background ─── */
    .bg-slideshow {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: url('assets/img/rajasthan_0.jpg') center/cover no-repeat;
      filter: brightness(0.6);
      /* Slow zoom animation */
      animation: zoomIn 20s linear infinite alternate;
    }
    @keyframes zoomIn {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    /* ─── Centered Login Modal ─── */
    .login-modal {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 50px 60px;
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      text-align: center;
    }

    .brand-header {
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .brand-header .dot { color: var(--terracotta); }
    
    .modal-subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 16px;
    }
    .login-input {
      width: 100%;
      padding: 16px 16px 16px 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
      background: white;
    }
    .login-input:focus { 
      border-color: var(--terracotta);
      box-shadow: 0 0 0 3px rgba(217, 107, 59, 0.1);
    }
    
    .pass-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 13px;
      color: var(--terracotta);
      text-decoration: none;
      margin-bottom: 24px;
    }
    .forgot-link:hover { text-decoration: underline; }

    .login-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: var(--terracotta);
      color: white;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 24px;
    }
    .login-btn:hover { background: #c05a2e; }

    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--light-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .social-btn {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    .social-btn:hover { border-color: var(--ink); background: #fafafa; }

    .guest-btn {
      margin-top: 20px;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
    }
    .guest-btn:hover { border-color: var(--terracotta); color: var(--terracotta); }

    .demo-notice {
      margin-top: 24px;
      font-size: 11px;
      color: var(--light-muted);
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .login-modal {
        padding: 40px 24px;
        margin: 20px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Full Screen Background -->
  <div class="bg-slideshow"></div>

  <!-- Centered Login Modal -->
  <div class="login-modal">
    <h1 class="brand-header">YATRA<span class="dot">.</span></h1>
    <p class="modal-subtitle">Continue your journey across India.</p>

    <form id="loginForm" novalidate>
      <div class="input-group">
        <span class="input-icon">✉</span>
        <input type="email" class="login-input" id="email" placeholder="Email address" required autocomplete="email">
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" class="login-input" id="password" placeholder="Password" required autocomplete="current-password">
        <button type="button" class="pass-toggle" id="passToggle" aria-label="Show password">👁</button>
      </div>

      <a href="#" class="forgot-link">Forgot password?</a>

      <button type="submit" class="login-btn">Log In</button>
    </form>

    <div class="or-divider">Or continue with</div>

    <button type="button" class="social-btn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Google
    </button>
    <button type="button" class="social-btn" id="microsoftBtn">
      <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Microsoft
    </button>
    <button type="button" class="social-btn guest-btn" id="guestBtn">
      👤 Continue as Guest
    </button>

    <p class="demo-notice">
      ⓘ Demo mode — No real authentication. Your session is simulated via localStorage.
    </p>
  </div>

  <script>
    // Password visibility toggle
    const passToggle = document.getElementById('passToggle');
    const passInput = document.getElementById('password');
    passToggle.addEventListener('click', () => {
      const isPassword = passInput.type === 'password';
      passInput.type = isPassword ? 'text' : 'password';
      passToggle.textContent = isPassword ? '🙈' : '👁';
    });

    // Login form submit (demo)
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      if (!email) return;
      localStorage.setItem('yatra_user', email);
      window.location.href = 'home.html';
    });

    // Social & Guest buttons (demo)
    document.getElementById('googleBtn').addEventListener('click', () => {
      localStorage.setItem('yatra_user', 'google_user');
      window.location.href = 'home.html';
    });
    document.getElementById('microsoftBtn').addEventListener('click', () => {
      localStorage.setItem('yatra_user', 'microsoft_user');
      window.location.href = 'home.html';
    });
    document.getElementById('guestBtn').addEventListener('click', () => {
      localStorage.setItem('yatra_user', 'guest_user');
      window.location.href = 'home.html';
    });
  </script>
</body>
</html>
