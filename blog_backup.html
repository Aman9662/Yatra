<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | YATRA</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ─── READING PROGRESS BAR ─── */
    .progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--terracotta); z-index: 9999; width: 0%; transition: width 0.1s; }

    /* ─── ARTICLE HERO ─── */
    .blog-hero-full { width: 100%; height: 85vh; min-height: 500px; background-size: cover; background-position: center; position: relative; display: flex; align-items: flex-end; }
    .blog-hero-full::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 40%, rgba(0,0,0,0.75)); }
    .blog-hero-inner { position: relative; z-index: 2; padding: 60px; max-width: 900px; color: white; }
    .blog-hero-inner .cat-badge { display: inline-block; background: var(--terracotta); color: white; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; }
    .blog-hero-inner h1 { font-size: 52px; font-family: var(--font-heading); line-height: 1.15; margin-bottom: 20px; text-shadow: 0 2px 20px rgba(0,0,0,0.4); }
    .blog-hero-inner .hero-excerpt { font-size: 20px; line-height: 1.6; opacity: 0.9; max-width: 700px; margin-bottom: 24px; }
    .blog-meta-bar { display: flex; gap: 28px; font-size: 14px; opacity: 0.85; flex-wrap: wrap; align-items: center; }
    .blog-meta-bar .author-avatar { width: 36px; height: 36px; background: var(--terracotta); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
    .blog-meta-bar span { display: flex; align-items: center; gap: 6px; }

    /* ─── TABLE OF CONTENTS ─── */
    .toc-strip { background: var(--paper); border-bottom: 1px solid var(--border-light); padding: 16px 0; position: sticky; top: 0; z-index: 50; }
    .toc-inner { display: flex; gap: 32px; overflow-x: auto; max-width: 900px; margin: 0 auto; padding: 0 20px; }
    .toc-inner a { white-space: nowrap; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 0; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .toc-inner a:hover, .toc-inner a.active { color: var(--terracotta); border-bottom-color: var(--terracotta); }

    /* ─── ARTICLE LAYOUT ─── */
    .blog-layout { display: grid; grid-template-columns: 1fr 320px; gap: 60px; max-width: 1200px; margin: 0 auto; padding: 60px 20px 80px; align-items: start; }

    /* ─── MAIN CONTENT ─── */
    .blog-main { }
    .blog-main p { font-size: 18px; line-height: 1.9; color: #333; margin-bottom: 28px; }
    .blog-main h2 { font-size: 32px; font-family: var(--font-heading); margin: 56px 0 24px; padding-top: 24px; border-top: 1px solid var(--border-light); }
    .blog-main h2:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
    .blog-main h3 { font-size: 22px; color: var(--terracotta); margin: 36px 0 16px; font-family: var(--font-heading); }
    .blog-main ul, .blog-main ol { margin-bottom: 28px; padding-left: 24px; font-size: 17px; line-height: 1.8; }
    .blog-main li { margin-bottom: 10px; }
    .blog-main .dropcap { float: left; font-size: 72px; line-height: 56px; padding: 4px 12px 0 0; font-family: var(--font-heading); color: var(--terracotta); }

    /* ─── PULL QUOTE ─── */
    .pull-quote { border-left: 4px solid var(--terracotta); padding: 24px 32px; margin: 40px 0; background: #fdf8f5; font-size: 22px; font-style: italic; line-height: 1.6; color: #555; border-radius: 0 var(--radius-md) var(--radius-md) 0; }

    /* ─── INLINE IMAGE ─── */
    .blog-img { width: 100%; height: 400px; background-size: cover; background-position: center; border-radius: var(--radius-md); margin: 36px 0; box-shadow: var(--shadow-sm); }
    .blog-img-caption { text-align: center; font-size: 13px; color: var(--muted); margin-top: -28px; margin-bottom: 36px; font-style: italic; }

    /* ─── PHOTO GALLERY STRIP ─── */
    .photo-strip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 36px 0; }
    .photo-strip .pstrip-img { height: 200px; background-size: cover; background-position: center; border-radius: var(--radius-sm); }

    /* ─── INFO BOX ─── */
    .info-box { background: #f0f7f4; border-left: 4px solid #2d8a5e; padding: 24px 28px; margin: 36px 0; border-radius: 0 var(--radius-md) var(--radius-md) 0; }
    .info-box.tip { background: #fdf5f2; border-left-color: var(--terracotta); }
    .info-box.warning { background: #fff8e6; border-left-color: #c9a227; }
    .info-box strong { display: block; margin-bottom: 8px; font-size: 16px; }

    /* ─── SIDEBAR ─── */
    .blog-sidebar { position: sticky; top: 60px; }
    .sw { background: var(--paper); padding: 28px; border-radius: var(--radius-md); border: 1px solid var(--border-light); margin-bottom: 24px; }
    .sw h4 { font-family: var(--font-heading); font-size: 18px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--terracotta); }
    .fact-row { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 14px; border-bottom: 1px dashed var(--border-light); padding-bottom: 10px; }
    .fact-row:last-child { border: none; margin-bottom: 0; padding-bottom: 0; }
    .fact-label { color: var(--muted); }
    .fact-val { font-weight: 600; text-align: right; max-width: 55%; }
    .itin-day { margin-bottom: 18px; }
    .itin-badge { display: inline-block; background: var(--terracotta); color: white; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; margin-bottom: 6px; }
    .itin-text { font-size: 14px; line-height: 1.55; color: #555; }
    .save-btn-blog { width: 100%; text-align: center; padding: 14px; font-size: 15px; cursor: pointer; }

    /* ─── SHARE BAR ─── */
    .share-strip { display: flex; gap: 12px; margin: 40px 0; padding: 20px 0; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); align-items: center; }
    .share-strip span { font-weight: 600; font-size: 14px; margin-right: 8px; }
    .share-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border: 1px solid var(--border-light); background: white; transition: all 0.2s; }
    .share-btn:hover { background: var(--terracotta); color: white; border-color: var(--terracotta); }

    /* ─── AUTHOR BOX ─── */
    .author-box { display: flex; gap: 20px; background: var(--paper); padding: 28px; border-radius: var(--radius-md); border: 1px solid var(--border-light); margin: 48px 0; }
    .author-box .ab-avatar { width: 64px; height: 64px; background: var(--terracotta); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: white; flex-shrink: 0; }
    .author-box .ab-info h4 { margin-bottom: 8px; font-family: var(--font-heading); }
    .author-box .ab-info p { font-size: 14px; line-height: 1.6; color: var(--muted); margin: 0; }

    /* ─── RELATED POSTS ─── */
    .related-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin: 36px 0 60px; }
    .rel-card { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-light); transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; }
    .rel-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .rel-card-img { height: 180px; background-size: cover; background-position: center; }
    .rel-card-body { padding: 16px; }
    .rel-card-body .rc-cat { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--terracotta); font-weight: 600; }
    .rel-card-body h4 { font-size: 16px; margin: 8px 0 0; font-family: var(--font-heading); }

    @media (max-width: 900px) {
      .blog-layout { grid-template-columns: 1fr; }
      .blog-sidebar { position: static; }
      .blog-hero-inner h1 { font-size: 32px; }
      .blog-hero-full { height: 60vh; }
      .blog-hero-inner { padding: 30px; }
      .related-grid { grid-template-columns: 1fr; }
      .photo-strip { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="home.html" class="brand nav-brand">YATRA.</a>
      <div class="nav-center">
        <a href="home.html">Stories</a>
        <a href="delhi.html">Delhi</a>
        <a href="rajasthan.html">Rajasthan</a>
        <a href="kerala.html">Kerala</a>
        <a href="goa.html">Goa</a>
        <a href="gujarat.html">Gujarat</a>
        <a href="assam.html">Assam</a>
      </div>
      <div class="nav-right">
        <a href="saved.html" id="savedLink" class="nav-saved-badge">Your Yatra (0)</a>
      </div>
    </div>
  </nav>

  <div id="articleContainer">
    <div style="padding: 200px 0; text-align: center;">Loading story...</div>
  </div>

  

  <script src="js/articles.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Run immediately — DOM is already ready since scripts are at bottom of body
    (() => {
      try {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') || 'delhi-featured';
        
        const container = document.getElementById('articleContainer');
        if (!container) return;

        if (!window.articlesData) {
          container.innerHTML = '<div style="padding:100px 0;text-align:center"><h2>Error: Articles database failed to load</h2><a href="home.html">← Back to Home</a></div>';
          return;
        }

        const allArticles = window.articlesData;
        const article = allArticles[id];
        
        if (!article) {
          container.innerHTML = '<div style="padding:100px 0;text-align:center"><h2>Article not found</h2><p>The story "' + id + '" does not exist.</p><a href="home.html">← Back to Home</a></div>';
          return;
        }

      // Build the article object with fallbacks
      const a = article || {
        title: "Exploring India",
        author: "Yatra Editorial",
        date: "Sept 2026",
        readTime: "5 min read",
        category: "Travel",
        heroImg: "assets/img/kerala_0.jpg",
        state: "India",
        excerpt: "A land of a thousand stories.",
        body: ["<p>India is a vast and diverse landscape that awaits your exploration.</p>"],
        quickFacts: { season: "Year Round", budget: "₹3,000 / day", idealDays: "Flexible", language: "Hindi, English", currency: "INR (₹)" },
        itinerary: [{ day: "Day 1", desc: "Arrive and explore." }],
        galleryImgs: [],
        relatedIds: []
      };

      // Gather related articles
      const relatedIds = (a.relatedIds || []).filter(rid => allArticles[rid]);
      const relatedCards = relatedIds.map(rid => {
        const r = allArticles[rid];
        return `<a href="blog.html?id=${rid}" class="rel-card">
          <div class="rel-card-img" style="background-image: url('${r.heroImg}')"></div>
          <div class="rel-card-body">
            <span class="rc-cat">${r.category}</span>
            <h4>${r.title}</h4>
          </div>
        </a>`;
      }).join('');

      // Gallery
      const galleryImgs = a.galleryImgs || [];
      const galleryHTML = galleryImgs.length >= 3 ? `
        <div class="photo-strip">
          ${galleryImgs.slice(0, 3).map(img => `<div class="pstrip-img" style="background-image: url('${img}')"></div>`).join('')}
        </div>` : '';

      // Body paragraphs
      const bodyHTML = (a.body || []).join('\n');

      const html = `
        <!-- HERO -->
        <div class="blog-hero-full" style="background-image: url('${a.heroImg}')">
          <div class="blog-hero-inner">
            <span class="cat-badge">${a.category}</span>
            <h1>${a.title}</h1>
            <p class="hero-excerpt">${a.excerpt || ''}</p>
            <div class="blog-meta-bar">
              <span><span class="author-avatar">${(a.author || 'Y')[0]}</span> ${a.author}</span>
              <span>📅 ${a.date}</span>
              <span>⏱ ${a.readTime}</span>
            </div>
          </div>
        </div>

        <!-- TOC -->
        <div class="toc-strip">
          <div class="toc-inner">
            <a href="#section-story">The Story</a>
            <a href="#section-plan">Plan Your Visit</a>
            <a href="#section-itinerary">Itinerary</a>
            <a href="#section-tips">Tips & Responsible Travel</a>
          </div>
        </div>

        <!-- BODY -->
        <div class="blog-layout">
          <main class="blog-main">

            <section id="section-story">
              ${bodyHTML}
            </section>

            ${galleryHTML}

            <section id="section-plan">
              <h2>Plan Your Visit</h2>
              ${(a.planSections || []).map(s => `
                <h3>${s.heading}</h3>
                <p>${s.text}</p>
              `).join('')}
            </section>

            <section id="section-itinerary">
              <h2>Suggested Itinerary</h2>
              ${(a.itinerary || []).map(day => `
                <h3>${day.day}</h3>
                <p>${day.desc}</p>
              `).join('')}
            </section>

            <section id="section-tips">
              <h2>Tips & Responsible Travel</h2>
              ${(a.tips || []).map(t => `
                <div class="info-box ${t.type || ''}">
                  <strong>${t.icon || '💡'} ${t.label}</strong>
                  ${t.text}
                </div>
              `).join('')}
            </section>

            <!-- SHARE -->
            <div class="share-strip">
              <span>Share this story:</span>
              <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href); alert('Link copied!')">🔗</button>
              <button class="share-btn" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent('${a.title} — YATRA'))">𝕏</button>
              <button class="share-btn" onclick="window.open('https://wa.me/?text='+encodeURIComponent('${a.title} '+location.href))">💬</button>
            </div>

            <!-- AUTHOR -->
            <div class="author-box">
              <div class="ab-avatar">${(a.author || 'Y')[0]}</div>
              <div class="ab-info">
                <h4>${a.author}</h4>
                <p>A passionate traveller and storyteller exploring India one state at a time. Based out of India, writing for the YATRA editorial desk.</p>
              </div>
            </div>

            <!-- RELATED -->
            ${relatedCards ? `
              <h2>Read Next</h2>
              <div class="related-grid">${relatedCards}</div>
            ` : ''}

          </main>

          <!-- SIDEBAR -->
          <aside class="blog-sidebar">
            <button class="btn-primary save-btn-blog" onclick="saveToYatra('${a.state}')">★ Save ${a.state} to My Journey</button>

            <div class="sw" style="margin-top: 24px;">
              <h4>Quick Facts</h4>
              ${Object.entries(a.quickFacts || {}).map(([k, v]) => `
                <div class="fact-row"><span class="fact-label">${k.charAt(0).toUpperCase() + k.slice(1)}</span><span class="fact-val">${v}</span></div>
              `).join('')}
            </div>

            <div class="sw">
              <h4>Day-by-Day</h4>
              ${(a.itinerary || []).map(day => `
                <div class="itin-day">
                  <span class="itin-badge">${day.day}</span>
                  <div class="itin-text">${day.desc.substring(0, 120)}${day.desc.length > 120 ? '…' : ''}</div>
                </div>
              `).join('')}
            </div>

            <div class="sw">
              <h4>Explore ${a.state}</h4>
              <a href="${(a.state || '').toLowerCase()}.html" class="btn-secondary" style="display:block; text-align:center; margin-top: 8px;">View all ${a.state} stories →</a>
            </div>
          </aside>
        </div>
      `;

      container.innerHTML = html;
      document.title = a.title + ' | YATRA';

      // Reading progress bar
      window.addEventListener('scroll', () => {
        const scrollTop = document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const progress = (scrollTop / height) * 100;
        document.getElementById('progressBar').style.width = progress + '%';
      });

      // Save to Yatra
      window.saveToYatra = (state) => {
        let saved = JSON.parse(localStorage.getItem('yatra_saved')) || [];
        if (!saved.includes(state)) {
          saved.push(state);
          localStorage.setItem('yatra_saved', JSON.stringify(saved));
          alert(state + ' added to your journey!');
          if (typeof window.updateNav === 'function') window.updateNav();
        } else {
          alert(state + ' is already in your journey!');
        }
      };
      } catch (err) {
        const container = document.getElementById('articleContainer');
        if (container) {
          container.innerHTML = '<div style="padding:100px 0;text-align:center;color:red;"><h2>Rendering Error</h2><p>' + err.message + '</p><pre style="text-align:left;max-width:600px;margin:0 auto;background:#f5f5f5;padding:15px;overflow:auto;">' + err.stack + '</pre></div>';
        } else {
          console.error(err);
        }
      }
    })();
  </script>
</body>
</html>
